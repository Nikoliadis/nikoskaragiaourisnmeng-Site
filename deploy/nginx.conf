# nginx για την ιστοσελίδα — αντικατάστησε karagiaouris.gr με το δικό σου domain.
# Αντιγραφή σε /etc/nginx/sites-available/karagiaouris.gr και symlink στο
# sites-enabled/. Έλεγχος με `nginx -t`, εφαρμογή με `systemctl reload nginx`.

# --- Όρια ρυθμού: 30 αιτήματα/λεπτό ανά IP, αυστηρότερα στο admin ----------
limit_req_zone $binary_remote_addr zone=site:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

upstream django {
    server unix:/run/gunicorn/karagiaouris.sock fail_timeout=0;
}

# --- HTTP: μόνο ανακατεύθυνση σε HTTPS -------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name karagiaouris.gr www.karagiaouris.gr;

    # Αφήνουμε το certbot να ανανεώνει το πιστοποιητικό.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- www -> σκέτο domain -----------------------------------------------------
# Και τα δύο ονόματα απαντούν, οπότε χωρίς αυτό η Google βλέπει δύο αντίγραφα
# κάθε σελίδας και μοιράζει την αξία τους. Διαλέγουμε ένα και το δηλώνουμε.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.karagiaouris.gr;

    ssl_certificate     /etc/letsencrypt/live/karagiaouris.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karagiaouris.gr/privkey.pem;

    return 301 https://karagiaouris.gr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name karagiaouris.gr;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/karagiaouris.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karagiaouris.gr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;          # TLS 1.0/1.1 είναι σπασμένα
    ssl_prefer_server_ciphers off;           # οι client προτιμήσεις είναι πια καλύτερες
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # --- Γενικά ------------------------------------------------------------
    server_tokens off;                       # κρύβει την έκδοση του nginx
    client_max_body_size 26m;                # ταιριάζει με το MAX_UPLOAD_SIZE (25 MB)
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    limit_conn conn 20;

    access_log /var/log/nginx/karagiaouris.access.log;
    error_log  /var/log/nginx/karagiaouris.error.log warn;

    # --- Συμπίεση ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    # Τα .jpg/.png/.woff2 είναι ήδη συμπιεσμένα — δεν τα ξανασυμπιέζουμε.

    # --- Στατικά αρχεία ----------------------------------------------------
    # Τα ονόματα έχουν hash (ManifestStaticFilesStorage), άρα immutable.
    location /static/ {
        alias /srv/karagiaouris/Frontend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location /media/ {
        alias /srv/karagiaouris/Database/media/;
        expires 30d;
        add_header Cache-Control "public" always;
        # Ό,τι κι αν ανέβει εδώ, δεν εκτελείται και δεν ανοίγει inline.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
    }

    # ΠΡΟΣΟΧΗ: το Database/protected_media/ ΔΕΝ σερβίρεται από εδώ.
    # Φτάνει στον χρήστη μόνο μέσω του Django (/lipsi/<id>/).

    # --- Admin: αυστηρό rate limit -----------------------------------------
    location /admin/ {
        limit_req zone=login burst=5 nodelay;
        # Προαιρετικά, αν έχεις σταθερή IP:
        # allow 1.2.3.4;  deny all;
        include /etc/nginx/snippets/django-proxy.conf;
    }

    location / {
        limit_req zone=site burst=20 nodelay;
        include /etc/nginx/snippets/django-proxy.conf;
    }

    # Κρυφά αρχεία και αντίγραφα δεν σερβίρονται ποτέ.
    location ~ /\.       { deny all; }
    location ~ ~$        { deny all; }
}

