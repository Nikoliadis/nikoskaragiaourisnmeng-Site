{% comment %}
  Instant search over the material already on the page. Starts hidden and is
  revealed by site.js, so a visitor without JavaScript is never shown a box
  that does nothing. Include it right above a [data-filter-list].
{% endcomment %}
<div data-filter class="mb-5 hidden">
  <label for="filter-input" class="sr-only">Αναζήτηση στο υλικό</label>
  <div class="relative">
    <span class="material-symbols-outlined pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-xl text-slate-400 dark:text-slate-500">search</span>
    <input id="filter-input" type="search" data-filter-input autocomplete="off"
           placeholder="Αναζήτηση στο υλικό…"
           class="w-full rounded-lg border border-slate-300 bg-white py-2.5 pl-11 pr-4 text-slate-900 placeholder-slate-400 shadow-sm transition focus:border-brand-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:placeholder-slate-500">
  </div>
  <p data-filter-count class="mt-2 text-sm text-slate-500 dark:text-slate-400"></p>
</div>
