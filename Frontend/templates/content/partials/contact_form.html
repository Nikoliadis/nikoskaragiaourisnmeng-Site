{% load i18n %}
<form id="contact-form"
      hx-post="{% url 'content:contact' %}"
      hx-target="#contact-form"
      hx-swap="outerHTML"
      class="space-y-4">
  {% csrf_token %}
  <div style="position:absolute;left:-9999px" aria-hidden="true">
    <label>Website{{ form.website }}</label>
  </div>

  <div>
    <label for="{{ form.name.id_for_label }}" class="mb-1 block text-sm font-medium text-slate-700">Όνομα</label>
    {{ form.name }}
    {% for e in form.name.errors %}<p class="mt-1 text-sm text-red-600">{{ e }}</p>{% endfor %}
  </div>
  <div>
    <label for="{{ form.email.id_for_label }}" class="mb-1 block text-sm font-medium text-slate-700">Email</label>
    {{ form.email }}
    {% for e in form.email.errors %}<p class="mt-1 text-sm text-red-600">{{ e }}</p>{% endfor %}
  </div>
  <div>
    <label for="{{ form.message.id_for_label }}" class="mb-1 block text-sm font-medium text-slate-700">Μήνυμα</label>
    {{ form.message }}
    {% for e in form.message.errors %}<p class="mt-1 text-sm text-red-600">{{ e }}</p>{% endfor %}
  </div>

  <button type="submit" class="btn-primary w-full justify-center">
    <span class="material-symbols-outlined text-base">send</span>
    Αποστολή μηνύματος
  </button>
</form>
