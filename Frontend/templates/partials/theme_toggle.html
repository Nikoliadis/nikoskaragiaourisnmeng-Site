{% comment %}
  Light/dark switch. Both icons are rendered and CSS shows the relevant one,
  so the button needs no inline style and no inline script — it stays inside
  the strict Content-Security-Policy. static/js/theme.js wires up the click
  and keeps the aria-label in sync.
{% endcomment %}
<button type="button" data-theme-toggle
        class="tip flex items-center rounded-md p-2 text-slate-600 transition hover:bg-slate-100 hover:text-brand-700 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-brand-400"
        aria-label="Εναλλαγή σε σκοτεινό θέμα" data-tip="Θέμα">
  <span class="material-symbols-outlined text-xl dark:hidden">dark_mode</span>
  <span class="material-symbols-outlined hidden text-xl dark:inline">light_mode</span>
</button>
